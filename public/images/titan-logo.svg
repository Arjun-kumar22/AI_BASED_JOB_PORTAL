<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="450" height="450">
  <defs>
    <style>
      .navy-bg { fill: #0a192f; }
      .gold-fill { fill: #c59247; }
      .white-fill { fill: #ffffff; }
      .text-title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- WREATH BRANCHES (LEFT & RIGHT) -->
  <g fill="#c59247">
    <!-- Left Laurel Wreath -->
    <path d="M 185 390 C 105 350 65 250 85 130 C 80 160 90 200 110 240 C 90 210 75 160 90 110 C 85 140 95 170 120 205 C 105 175 95 130 115 85 C 115 110 130 140 155 165 C 135 135 130 95 155 50 C 150 75 165 105 195 130" stroke="#c59247" stroke-width="3" fill="none"/>
    
    <!-- Leaves Left -->
    <path d="M 170 375 Q 145 365 130 345 Q 155 345 170 375 Z"/>
    <path d="M 145 340 Q 120 325 110 300 Q 135 305 145 340 Z"/>
    <path d="M 125 300 Q 100 280 95 250 Q 117 260 125 300 Z"/>
    <path d="M 110 255 Q 85 230 85 200 Q 105 210 110 255 Z"/>
    <path d="M 100 205 Q 75 180 80 150 Q 97 165 100 205 Z"/>
    <path d="M 100 155 Q 77 125 85 95 Q 100 115 100 155 Z"/>
    <path d="M 110 110 Q 90 80 103 50 Q 115 75 110 110 Z"/>
    
    <!-- Right Laurel Wreath -->
    <path d="M 265 390 C 345 350 385 250 365 130 C 370 160 360 200 340 240 C 360 210 375 160 360 110 C 365 140 355 170 330 205 C 345 175 355 130 335 85 C 335 110 320 140 295 165 C 315 135 320 95 295 50 C 300 75 285 105 255 130" stroke="#c59247" stroke-width="3" fill="none"/>
    
    <!-- Leaves Right -->
    <path d="M 280 375 Q 305 365 320 345 Q 295 345 280 375 Z"/>
    <path d="M 305 340 Q 330 325 340 300 Q 315 305 305 340 Z"/>
    <path d="M 325 300 Q 350 280 355 250 Q 333 260 325 300 Z"/>
    <path d="M 340 255 Q 365 230 365 200 Q 345 210 340 255 Z"/>
    <path d="M 350 205 Q 375 180 370 150 Q 353 165 350 205 Z"/>
    <path d="M 350 155 Q 373 125 365 95 Q 350 115 350 155 Z"/>
    <path d="M 340 110 Q 360 80 347 50 Q 335 75 340 110 Z"/>

    <!-- Bottom Crossed Stems -->
    <path d="M 185 390 L 245 420 M 265 390 L 205 420" stroke="#c59247" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- SHIELD CONTAINER -->
  <!-- Outer Gold Shield Outline -->
  <path d="M 225 50 Q 285 30 340 80 C 340 240 225 330 225 330 C 225 330 110 240 110 80 Q 165 30 225 50 Z" fill="#c59247"/>
  <!-- Inner Navy Shield Body -->
  <path d="M 225 58 Q 281 39 332 84 C 332 232 225 318 225 318 C 225 318 118 232 118 84 Q 169 39 225 58 Z" fill="#0a192f"/>

  <!-- ESTD. 2025 -->
  <text x="225" y="102" text-anchor="middle" fill="#ffffff" class="text-title" font-size="13" letter-spacing="3">ESTD. 2025</text>

  <!-- TITAN BANNER SECTION -->
  <g>
    <!-- Top & Bottom Double Gold Bars -->
    <line x1="110" y1="122" x2="340" y2="122" stroke="#c59247" stroke-width="4"/>
    <line x1="110" y1="180" x2="340" y2="180" stroke="#c59247" stroke-width="4"/>
    
    <!-- TITAN Text -->
    <text x="225" y="167" text-anchor="middle" fill="#c59247" class="text-title" font-size="46" letter-spacing="8">TITAN</text>
  </g>

  <!-- OPEN BOOK AND GLOBE EMBLEM -->
  <g transform="translate(225, 230)">
    <!-- Book Pages -->
    <path d="M -40 -20 Q -20 -32 0 -20 Q 20 -32 40 -20 L 40 18 Q 20 6 0 18 Q -20 6 -40 18 Z" fill="#ffffff"/>
    <path d="M -34 -15 Q -17 -25 0 -15 Q 17 -25 34 -15 L 34 14 Q 17 4 0 14 Q -17 4 -34 14 Z" fill="#0a192f"/>
    <path d="M -30 -12 Q -15 -21 -2 -12 L -2 11 Q -15 2 -30 11 Z" fill="#ffffff"/>
    <path d="M 2 -12 Q 15 -21 30 -12 L 30 11 Q 15 2 2 11 Z" fill="#ffffff"/>
    
    <!-- Globe in Center -->
    <circle cx="0" cy="5" r="11" fill="#0a192f" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="0" cy="5" rx="5" ry="11" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="-11" y1="5" x2="11" y2="5" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="-9" y1="10" x2="9" y2="10" stroke="#ffffff" stroke-width="0.8"/>
  </g>

</svg>
